<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas - Tesla</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="assents/tesla.png" alt="Logotipo Nikola Tesla" class="logo">
            <h1>Laboratório de Notas</h1>
        </div>

        <div class="form-group">
            <label for="nota1">1ª Avaliação:</label>
            <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="Ex: 8.5">
        </div>
        
        <div class="form-group">
            <label for="nota2">2ª Avaliação:</label>
            <input type="number" id="nota2" step="0.1" min="0" max="10" placeholder="Ex: 7.0">
        </div>
        
        <div class="form-group">
            <label for="nota3">3ª Avaliação:</label>
            <input type="number" id="nota3" step="0.1" min="0" max="10" placeholder="Ex: 6.5">
        </div>

        <button onclick="calcularMedia()">CALCULAR DADOS</button>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
